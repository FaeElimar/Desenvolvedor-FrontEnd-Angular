<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA-EDUCA+</title>
    <link rel="stylesheet" href="login.css">
    <script type="module" src="login.js" defer></script>
</head>

<body>
    <main>
        <form id="login">

            <div class="logo-login">
                <img src="../assets/images/LogoAVA.png" alt="Logo AVA-EDUCA+" class="img-logo">
            </div>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite o seu e-mail." required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha." required>

            <button type="submit" class="btn-entrar">Entrar</button>

            <a href="#" id="res-senha" class="link-senha">Esqueci minha senha.</a>


        </form>


    </main>

</body>

</html>
