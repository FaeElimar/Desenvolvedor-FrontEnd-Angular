<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno - AVA-EDUCA+</title>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/cadastro-aluno.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script type="module" src="cadastro-aluno.js" defer></script>
</head>

<body>
    <header class="cabecalho">
        <img src="../assets/images/LogoAVA.png" alt="Logo AVA-EDUCA+">

    </header>

    <div class="container-principal">
        <aside class="menu-lateral">
            <nav>
                <ul>
                    <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
                    <li><a href="cadastro-aluno.html">Cadastro</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo-dashboard">
            <h1>Cadastro de Aluno</h1>

            <form id="form-cadastro-aluno">
                <!-- Secção: Dados Pessoais -->
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="nome">Nome Completo:</label>
                            <input type="text" id="nome" name="nome" minlength="4" maxlength="80" required>
                        </div>

                        <div class="form-group">
                            <label for="genero">Gênero:</label>
                            <select id="genero" name="genero" required>
                                <option value="">Selecione...</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="dataNascimento">Data de Nascimento:</label>
                            <input type="text" id="dataNascimento" name="dataNascimento" placeholder="DD/MM/AAAA"
                                required>
                        </div>

                        <div class="form-group full-width">
                            <label for="cpf">CPF:</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                        </div>
                    </div>
                </fieldset>

                <!-- Secção: Contato -->
                <fieldset>
                    <legend>Contato</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="telefone">Telefone:</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                </fieldset>

                <!-- Secção: Endereço -->
                <fieldset>
                    <legend>Endereço</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cep">CEP:</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                        </div>

                        <div class="form-group">
                            <label for="logradouro">Logradouro:</label>
                            <input type="text" id="logradouro" name="logradouro" required>
                        </div>

                        <div class="form-group">
                            <label for="numero">Número:</label>
                            <input type="text" id="numero" name="numero" required>
                        </div>

                        <div class="form-group">
                            <label for="complemento">Complemento:</label>
                            <input type="text" id="complemento" name="complemento">
                        </div>

                        <div class="form-group">
                            <label for="bairro">Bairro:</label>
                            <input type="text" id="bairro" name="bairro" required>
                        </div>

                        <div class="form-group">
                            <label for="cidade">Cidade:</label>
                            <input type="text" id="cidade" name="cidade" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="estado">Estado:</label>
                            <input type="text" id="estado" name="estado" required>
                        </div>
                    </div>
                </fieldset>

                <button type="submit" id="btn-salvar">Salvar Cadastro</button>
            </form>
        </main>
    </div>
</body>

</html>
